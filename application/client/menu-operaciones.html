<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operations menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <img class="logo" src="./img/logo.png">
        <a href="index.html">Start</a>
        <a href="documentacion.html">Documentation</a>
        <a href="login.html">Log in</a>
        <a href="menu-operaciones.html"><img class="flecha" src="./img/flecha.png"></a>
    </nav>
    <br>
    <select id="operacion">
        <option value="crear.html">Create a new order</option>
        <option value="listar.html">View commands</option>
    </select>

    <button id="btnAcceder">Access the selected operation</button>
    <button id="btnInicio">Return to the beginning</button>

    <script>
        const select = document.getElementById("operacion");
        
        document.getElementById("btnAcceder").addEventListener("click", () => {
            window.location.href = select.value;
        });

        document.getElementById("btnInicio").addEventListener("click", () => {
            window.location.href = "index.html";
        });
    </script>
</body>

</html>
