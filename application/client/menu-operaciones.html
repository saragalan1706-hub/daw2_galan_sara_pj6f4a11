<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operations menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <img class="logo" src="./img/logo.png">
        <a href="index.html">Start</a>
        <a href="documentacion.html">Documentation</a>
        <a href="login.html">Log in</a>
        <a href="menu-operaciones.html"><img class="flecha" src="./img/flecha.png"></a>
    </nav>
    <div class="menu-container">
        <div class="menu-card">
            <h2>Operations menu</h2>

            <select id="operacion">
                <option value="crear.html">Create a new order</option>
                <option value="listar.html">View commands</option>
            </select>

            <!-- clase btn-principal: acción principal, en azul oscuro -->
            <button id="btnAcceder" class="btn-principal">Access the selected operation</button>
            <!-- clase btn-secundario: acción de vuelta, con menos peso visual -->
            <button id="btnInicio" class="btn-secundario">Return to the beginning</button>
        </div>
    </div>
    <footer>
		<p>SportMás &copy; 2026</p>
		<p>123 Sports Avenue, Barcelona, Spain</p>
		<p>contact@sportmas.example</p>
	</footer>
    <script>
        const select = document.getElementById("operacion");
        
        document.getElementById("btnAcceder").addEventListener("click", () => {
            window.location.href = select.value;
        });

        document.getElementById("btnInicio").addEventListener("click", () => {
            window.location.href = "index.html";
        });
    </script>
</body>

</html>
