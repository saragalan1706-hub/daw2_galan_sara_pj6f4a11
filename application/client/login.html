<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <img class="logo" src="./img/logo.png">
        <a href="index.html">Start</a>
        <a href="documentacion.html">Documentation</a>
        <a href="login.html">Log in</a>
        <a href="menu-operaciones.html"><img class="flecha" src="./img/flecha.png"></a>
    </nav>

	<!-- Sin action ni method: el envío lo hace el JavaScript con fetch -->
	<form id="loginForm">
		<h2>Login</h2>

		<label for="username">Username</label>
		<!-- name="username": PHP lo recibe como $_POST["username"] -->
		<input type="text" id="username" name="username" required>

		<label for="password">Password</label>
		<input type="password" id="password" name="password" required>

		<button type="submit">Access operations menu</button>
	</form>

	<script>
		// Se ejecuta al enviar el formulario
		async function login(event) {
			event.preventDefault();   // evita el envío normal del navegador (el GET)

			// Leemos lo que ha escrito el usuario
			const username = document.getElementById("username").value.trim();
			const password = document.getElementById("password").value;

			// Control en el cliente: si falta algún dato, no se envía nada
			if (username === "" || password === "") {
				alert("Please enter your username and password.");
				return;
			}

			// Enviamos los datos al servidor por POST
			const response = await fetch("../server/login.php", {
				method: "POST",
				body: new FormData(document.getElementById("loginForm"))   // recoge los campos con name
			});

			if (response.ok) {
				// El servidor respondió 200: vamos al menú de operaciones
				window.location.href = "menu-operaciones.html";
			} else {
				// El servidor respondió 401: mostramos el error y volvemos al inicio
				alert("Authentication error: the user could not be validated.");
				window.location.href = "index.html";
			}
		}

		// Conectamos la función al evento "submit" del formulario
		document.getElementById("loginForm").addEventListener("submit", login);
	</script>
</body>

</html>
